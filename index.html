<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un detalle</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#0e1630;--oro:#ffd37a;--rosa:#ff7aa2;--lila:#ede7f6}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--lila);background:radial-gradient(ellipse at 50% 100%,#2f2a6b,var(--noche) 70%);min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 14px 22px}
h1{font-family:Fraunces,Georgia,serif;font-size:clamp(1.7rem,6vw,2.5rem);margin:0}
.sub{margin:6px 0 10px;opacity:.8;min-height:1.5em}
svg{width:100%;max-width:470px;height:auto;max-height:calc(100svh - 270px);min-height:260px;touch-action:manipulation}
.fondo circle{fill:#fff;opacity:.7}
.linea{stroke:var(--oro);stroke-width:.9;stroke-linecap:round;filter:drop-shadow(0 0 1.5px var(--oro))}
.punto{cursor:pointer;outline:none}
.punto .halo{fill:var(--oro);opacity:.25}
.punto .nucleo{fill:var(--lila)}
.punto.sig .halo{animation:late 1.2s ease-in-out infinite alternate;opacity:.5}
.punto.hecho .nucleo{fill:var(--oro)}
.punto:focus-visible .halo{stroke:#fff;stroke-width:.6}
@keyframes late{from{r:3.5}to{r:6.5}}
.contorno{fill:none;stroke:var(--oro);stroke-width:.8;opacity:0;transition:opacity 1.6s;filter:drop-shadow(0 0 2px var(--oro))}
.listo .contorno{opacity:.9}
.foto{opacity:0;transition:opacity 1.6s}
.listo .foto{opacity:1}
.btnfoto{margin-top:6px;background:transparent;color:var(--lila);border:2px solid var(--lila);border-radius:999px;padding:9px 22px;font:inherit;font-weight:700;cursor:pointer}
.btnfoto:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.frase{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(1.5rem,5.5vw,2.3rem);line-height:1.3;max-width:560px;margin:14px 0 0;opacity:0;transition:opacity 1.6s .6s}
.listo~.frase{opacity:1}
[contenteditable]{outline:none}
[contenteditable]:focus{background:rgba(255,255,255,.1)}
@media (prefers-reduced-motion:reduce){.punto.sig .halo{animation:none}.contorno,.frase,.foto{transition:none}}
</style>
</head>
<body>

<p class="frase" id="f" contenteditable="true" spellcheck="false">Sos de esas personas que brillan sin darse cuenta.</p>
<script>
const P=[[50,119.8],[23.6,84.8],[6.8,46.3],[11.6,25],[29.6,21],[50,28],[70.4,21],[88.4,25],[93.2,46.3],[76.4,84.8]];
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('s'),L=document.getElementById('lineas'),G=document.getElementById('puntos');
function suavizar(pts){
  const n=pts.length;let d='M'+pts[0].join(',');
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=' C'+c1.join(',')+' '+c2.join(',')+' '+p2.join(',');
  }
  return d+' Z';
}
const suave=suavizar(P);
let n=0;const nodos=[];
P.forEach((p,i)=>{
  const g=document.createElementNS(NS,'g');g.setAttribute('class','punto');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label','Estrella '+(i+1));
  g.innerHTML='<circle class="halo" cx="'+p[0]+'" cy="'+p[1]+'" r="4.5"/><circle class="nucleo" cx="'+p[0]+'" cy="'+p[1]+'" r="1.8"/>';
  g.addEventListener('click',()=>tocar(i));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tocar(i);}});
  G.appendChild(g);nodos.push(g);
});
function marcar(){nodos.forEach((g,i)=>g.classList.toggle('sig',i===n));}
function linea(a,b){
  const l=document.createElementNS(NS,'line');l.setAttribute('class','linea');
  l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);L.appendChild(l);
}
function tocar(i){
  if(i!==n)return;
  nodos[i].classList.add('hecho');
  if(i>0)linea(P[i-1],P[i]);
  n++;
  if(n===P.length){
    linea(P[P.length-1],P[0]);nodos.forEach(g=>g.classList.remove('sig'));
    document.getElementById('rel').setAttribute('d',suave);
    document.getElementById('sub').textContent='';
    svg.classList.add('listo');
  }else marcar();
}
document.getElementById('cp').setAttribute('d',suave);
marcar();
</script>
